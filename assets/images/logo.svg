<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="phbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="phtop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
  </defs>

  <!-- rounded gradient background -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#phbg)"/>

  <!-- isometric package / product box -->
  <polygon points="256,92 376,160 256,228 136,160" fill="url(#phtop)"/>
  <polygon points="136,160 256,228 256,358 136,290" fill="#c7d2fe"/>
  <polygon points="376,160 376,290 256,358 256,228" fill="#a5b4fc"/>

  <!-- box tape stripe -->
  <polygon points="238,104 274,125 274,344 238,334" fill="#4f46e5" opacity="0.35"/>

  <!-- brand name -->
  <text x="256" y="446" font-family="'Segoe UI', Arial, sans-serif" font-size="74" font-weight="700" fill="#ffffff" text-anchor="middle">ProductHub</text>
</svg>
